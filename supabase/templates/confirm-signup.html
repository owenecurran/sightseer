<!--
  Supabase Auth → Email Templates → "Confirm signup".

  NOT applied by being in this repo. The [auth.email.template] blocks in
  supabase/config.toml only take effect for a local `supabase start`, and
  this app always points at the hosted project (see AGENTS.md) — so this
  file is the source of truth for the markup, and the dashboard is where it
  has to be pasted.

  Two things this template CANNOT fix on its own:

    * The sender. With Supabase's built-in mailer these arrive from
      noreply@mail.app.supabase.io and the name cannot be changed. Sending
      as Sightseer requires custom SMTP (Auth → SMTP Settings) pointed at
      your own domain. That is also required for launch regardless — the
      built-in mailer is heavily rate-limited and explicitly not for
      production.

    * The logo is served from the web deployment, which needed no custom
      domain to work. If sightseer.world is later pointed at that same
      deployment, this URL keeps resolving either way — so it does not have
      to change. It is a PNG rather than the source SVG because Gmail and
      several other clients do not render SVG in email at all.

  Available variables: {{ .ConfirmationURL }}, {{ .Token }},
  {{ .TokenHash }}, {{ .SiteURL }}, {{ .Email }}, {{ .RedirectTo }}.

  Written as table layout with inline styles because that is what mail
  clients reliably render — flexbox, grid and <style> blocks are all
  unreliable across Outlook and Gmail.
-->
<table
  role="presentation"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  style="margin:0;padding:0;background-color:#031009;"
>
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <img
              src="https://alien-app.expo.app/sightseer-logo.png"
              width="240"
              height="137"
              alt="Sightseer"
              style="display:block;border:0;outline:none;text-decoration:none;"
            />
          </td>
        </tr>

        <tr>
          <td
            align="center"
            style="font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:38px;color:#eae7cf;padding-bottom:16px;"
          >
            Confirm your email
          </td>
        </tr>

        <tr>
          <td
            align="center"
            style="font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:rgba(234,231,207,0.65);padding-bottom:32px;"
          >
            You're one tap from your travel journal. Confirm {{ .Email }} to finish setting up
            your account.
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:32px;">
            <!-- A real anchor styled as a button: mail clients do not
                 render <button>, and a table-cell button loses its link on
                 some Android clients. -->
            <a
              href="{{ .ConfirmationURL }}"
              style="display:inline-block;background-color:#eae7cf;color:#031009;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;text-decoration:none;padding:14px 32px;border-radius:16px;"
            >
              Confirm email
            </a>
          </td>
        </tr>

        <tr>
          <td
            align="center"
            style="font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:rgba(234,231,207,0.65);padding-bottom:8px;"
          >
            If the button does not work, paste this into your browser:
          </td>
        </tr>
        <tr>
          <td
            align="center"
            style="font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#a0bd91;word-break:break-all;padding-bottom:32px;"
          >
            {{ .ConfirmationURL }}
          </td>
        </tr>

        <tr>
          <td
            align="center"
            style="font-family:Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:rgba(234,231,207,0.45);border-top:1px solid rgba(234,231,207,0.12);padding-top:24px;"
          >
            If you did not create a Sightseer account, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
