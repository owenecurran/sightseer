<!--
  Supabase Auth → Email Templates → "Reset password".

  NOT applied by being in this repo. The [auth.email.template] blocks in
  supabase/config.toml only take effect for a local `supabase start`, and
  this app always points at the hosted project (see AGENTS.md) — so this
  file is the source of truth for the markup, and the dashboard is where it
  has to be pasted.

  STILL A LINK, unlike confirm-signup.html. Resetting lands on
  src/app/reset-password.tsx, which needs the recovery session the link
  carries. Turning this into a code as well would mean a second code screen
  and verifyOtp({ type: 'recovery' }) before the new password can be set —
  worth doing for consistency, but it is a flow change rather than a
  template change.

  ONE COLOUR SCHEME, FORCED — same three mechanisms as confirm-signup.html,
  because no one of them is enough on its own:

    * Solid hex everywhere, never rgba(). Several clients drop rgba
      outright and fall back to the inherited colour, which on a dark
      ground means dark text on dark. The muted tones here are the same
      cream pre-blended against the background.
    * bgcolor attributes alongside the inline background-color, for clients
      that honour the attribute and ignore the style.
    * !important plus the [data-ogsc] block, which is the hook Outlook.com
      and Windows Mail leave behind after rewriting colours for their own
      dark mode.

  Gmail's mobile dark mode may still shift things; it rewrites colours with
  no override hook at all.

  Available variables (named without their {{ }} delimiters on purpose:
  Supabase substitutes them anywhere in the file, comments included):
  .ConfirmationURL, .Token, .TokenHash, .SiteURL, .Email, .RedirectTo.

  Written as table layout with inline styles because that is what mail
  clients reliably render — flexbox, grid and <style> blocks are all
  unreliable across Outlook and Gmail.
-->
<style>
  :root {
    color-scheme: dark;
    supported-color-schemes: dark;
  }
  [data-ogsc] .ss-ground {
    background-color: #031009 !important;
  }
  [data-ogsc] .ss-cream {
    color: #eae7cf !important;
  }
  [data-ogsc] .ss-muted {
    color: #999c8a !important;
  }
  [data-ogsc] .ss-faint {
    color: #6b7162 !important;
  }
  [data-ogsc] .ss-button {
    background-color: #eae7cf !important;
    color: #031009 !important;
  }
</style>

<table
  role="presentation"
  class="ss-ground"
  width="100%"
  cellpadding="0"
  cellspacing="0"
  bgcolor="#031009"
  style="margin: 0; padding: 0; background-color: #031009 !important"
>
  <tr>
    <td class="ss-ground" align="center" bgcolor="#031009" style="padding: 40px 16px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px">
        <tr>
          <td align="center" style="padding-bottom: 28px">
            <img
              src="https://alien-app.expo.app/sightseer-logo-email.png"
              width="240"
              height="137"
              alt="Sightseer"
              style="display: block; border: 0; outline: none; text-decoration: none"
            />
          </td>
        </tr>

        <tr>
          <td
            class="ss-cream"
            align="center"
            style="
              font-family: Georgia, 'Times New Roman', serif;
              font-size: 32px;
              line-height: 38px;
              color: #eae7cf !important;
              padding-bottom: 16px;
            "
          >
            Reset your password
          </td>
        </tr>

        <tr>
          <td
            class="ss-muted"
            align="center"
            style="
              font-family: Helvetica, Arial, sans-serif;
              font-size: 15px;
              line-height: 23px;
              color: #999c8a !important;
              padding-bottom: 32px;
            "
          >
            Someone asked to reset the password for {{ .Email }}. Tap below to choose a new one.
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom: 32px">
            <!-- A real anchor styled as a button: mail clients do not
                 render <button>, and a table-cell button loses its link on
                 some Android clients. -->
            <a
              class="ss-button"
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background-color: #eae7cf !important;
                color: #031009 !important;
                font-family: Helvetica, Arial, sans-serif;
                font-size: 16px;
                font-weight: bold;
                text-decoration: none;
                padding: 14px 32px;
                border-radius: 16px;
              "
            >
              Choose a new password
            </a>
          </td>
        </tr>

        <tr>
          <td
            class="ss-muted"
            align="center"
            style="
              font-family: Helvetica, Arial, sans-serif;
              font-size: 13px;
              line-height: 20px;
              color: #999c8a !important;
              padding-bottom: 8px;
            "
          >
            If the button does not work, paste this into your browser:
          </td>
        </tr>
        <tr>
          <td
            align="center"
            style="
              font-family: Helvetica, Arial, sans-serif;
              font-size: 12px;
              line-height: 18px;
              color: #a0bd91 !important;
              word-break: break-all;
              padding-bottom: 32px;
            "
          >
            {{ .ConfirmationURL }}
          </td>
        </tr>

        <tr>
          <td
            class="ss-faint"
            align="center"
            style="
              font-family: Helvetica, Arial, sans-serif;
              font-size: 12px;
              line-height: 18px;
              color: #6b7162 !important;
              border-top: 1px solid #1f2a21;
              padding-top: 24px;
            "
          >
            If you did not ask for this, you can ignore this email — your password will not change.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
